<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Assistant</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="chat-wrapper">
        <header class="chat-header">
            <div class="agent-info">
                <div class="agent-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"></path>
                        <path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.2V21"></path>
                    </svg>
                </div>
                <div class="agent-meta">
                    <h1 class="agent-name">Inventory Assistant</h1>
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">Connected</span>
                    </div>
                </div>
            </div>
        </header>

        <section class="messages-container" id="messagesContainer">
            <div class="message-group bot-msg">
                <div class="message-bubble">
                    Hi, I'm your inventory assistant. What would you like to know?
                </div>
                <span class="message-timestamp">Just now</span>
            </div>

            <div class="message-group bot-msg typing-row hidden" id="typingIndicator">
                <div class="message-bubble typing-bubble">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </section>

        <footer class="chat-input-area">
            <form id="chatForm" class="input-form">
                <input type="text" id="userInput" placeholder="Message Inventory Assistant" autocomplete="off" aria-label="Message Inventory Assistant" required />
                <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
            </form>
        </footer>
    </main>

    <script type="module" src="app.js"></script>
</body>

</html>
